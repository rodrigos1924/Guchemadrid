<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUCHE — El mundo entre panes</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3eee5;color:#111}a{color:inherit;text-decoration:none}.hero{min-height:88vh;background:#050505;color:#fff;display:grid;place-items:center;text-align:center;padding:80px 24px}.logo{width:min(320px,68vw);display:block;margin:auto}.hero h1{font-size:clamp(44px,8vw,112px);line-height:.92;letter-spacing:-.06em;margin:36px 0 18px}.hero p{opacity:.7;text-transform:uppercase;letter-spacing:.18em;font-size:12px}.nav{position:fixed;z-index:20;top:18px;right:18px;display:flex;gap:8px}.nav a{background:rgba(255,255,255,.9);padding:11px 16px;border-radius:999px;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.section{padding:90px max(22px,6vw)}.sectionhead{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid #aaa;padding-bottom:20px;margin-bottom:40px}.sectionhead h2{font-size:clamp(42px,7vw,86px);letter-spacing:-.055em;line-height:.92;margin:0}.sectionhead span{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.world{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:40px;align-items:center;margin-bottom:70px}.globeWrap{aspect-ratio:1;border-radius:50%;max-width:620px;margin:auto;background:#0b0b0b;display:grid;place-items:center;box-shadow:0 20px 80px #0003;overflow:hidden}.globeWrap canvas{width:100%;height:100%;cursor:grab}.countries{display:grid;gap:10px}.countries button{width:100%;text-align:left;border:0;border-bottom:1px solid #aaa;background:transparent;padding:18px 0;font-size:clamp(22px,3vw,38px);cursor:pointer;display:flex;justify-content:space-between}.countries button:hover{padding-left:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;cursor:pointer;overflow:hidden}.pic{aspect-ratio:4/3;background-image:var(--sprite);background-size:300% 300%;background-repeat:no-repeat;background-color:#ddd}.cardText{padding:18px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;opacity:.55;margin-bottom:8px}.card h3{font-size:28px;line-height:1;margin:0}.sides{background:#090909;color:#fff}.sides .sectionhead{border-color:#333}.sides .card{background:#171717;color:#fff}.sides .cardText p{opacity:.72;line-height:1.5}.modal{position:fixed;z-index:50;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.panel{width:min(1050px,96vw);max-height:92vh;overflow:auto;background:#f3eee5;display:grid;grid-template-columns:1fr 1fr;position:relative}.modalpic{min-height:520px;background-image:var(--sprite);background-size:300% 300%;background-repeat:no-repeat;background-color:#ddd}.info{padding:48px}.close{position:absolute;right:18px;top:18px;border:1px solid #222;border-radius:50%;width:42px;height:42px;background:#f3eee5;font-size:20px;cursor:pointer}.info h2{font-size:clamp(44px,6vw,78px);letter-spacing:-.055em;line-height:.9;margin:10px 0 25px}.info p{font-size:17px;line-height:1.55}.story{border-top:1px solid #bbb;margin-top:30px;padding-top:25px}.story b{display:block;text-transform:uppercase;font-size:11px;letter-spacing:.16em;margin-bottom:10px}footer{background:#090909;color:#fff;padding:50px max(22px,6vw);display:flex;justify-content:space-between;align-items:center}footer img{width:140px}@media(max-width:800px){.world,.panel{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.globeWrap{width:86vw}.modalpic{min-height:300px}.info{padding:30px}.section{padding-top:70px}.nav{top:auto;bottom:14px;right:14px}.hero{min-height:78vh}}</style><script src="assets.js"></script><script src="sprite.js"></script><script src="sprite1.js"></script><script src="sprite2.js"></script><script src="sprite3.js"></script></head><body><nav class="nav"><a href="#guches">Guches</a><a href="#sides">Sides</a></nav><header class="hero"><div><img id="logo" class="logo" alt="GUCHE"><h1>EL MUNDO<br>ENTRE PANES.</h1><p>Madrid · seis orígenes · una misma obsesión</p></div></header><main><section class="section" id="guches"><div class="sectionhead"><h2>SEIS ORÍGENES.<br>SEIS GUCHES.</h2><span>Explora el mundo</span></div><div class="world"><div class="globeWrap"><canvas id="globe" width="700" height="700"></canvas></div><div class="countries" id="countries"></div></div><div class="grid" id="products"></div></section><section class="section sides" id="sides"><div class="sectionhead"><h2>SIDES.</h2><span>03 — Para acompañar</span></div><div class="grid" id="sidegrid"></div></section></main><footer><img id="footerLogo" alt="GUCHE"><span>EL MUNDO ENTRE PANES.</span></footer><div class="modal" id="modal"><div class="panel"><button class="close" id="closeBtn">×</button><div class="modalpic" id="modalpic"></div><div class="info"><div class="eyebrow" id="modalcountry"></div><h2 id="modalname"></h2><p id="modaldesc"></p><div class="story"><b>Historia / Storytelling</b><p id="modalstory"></p></div></div></div></div><script>(()=>{const $=id=>document.getElementById(id);const logo=$('logo'),footerLogo=$('footerLogo'),products=$('products'),countries=$('countries'),sidegrid=$('sidegrid'),modal=$('modal'),modalpic=$('modalpic'),modalcountry=$('modalcountry'),modalname=$('modalname'),modaldesc=$('modaldesc'),modalstory=$('modalstory'),closeBtn=$('closeBtn'),c=$('globe');if(typeof GUCHE_LOGO!=='undefined'){logo.src=GUCHE_LOGO;footerLogo.src=GUCHE_LOGO}else{logo.style.display='none';footerLogo.style.display='none'}const chunks=Array.isArray(window.__SPR)?window.__SPR.join(''):'';const sprite=chunks?'data:image/jpeg;base64,'+chunks:(typeof GUCHE_SPRITE!=='undefined'?GUCHE_SPRITE:'');if(sprite)document.documentElement.style.setProperty('--sprite',`url("${sprite}")`);const positions=[['0%','0%'],['50%','0%'],['100%','0%'],['0%','50%'],['50%','50%'],['100%','50%'],['0%','100%'],['50%','100%'],['100%','100%']];const P=[{country:'Perú',name:'Sánguche de chicharrón',lat:-9.19,lon:-75,sp:0,desc:'Uno de los grandes desayunos y bocadillos peruanos: cerdo cocinado hasta quedar meloso por dentro y crujiente por fuera, acompañado de camote dorado y salsa criolla de cebolla morada, lima, cilantro y chile.',story:'Su historia nace del mestizaje. El cerdo llegó al Perú con los españoles durante la conquista y, con el tiempo, el chicharrón se integró a ingredientes profundamente peruanos como el camote y el ají. En Lima terminó convirtiéndose en uno de los grandes clásicos del street food: pan, chicharrón de cerdo, camote frito y salsa criolla, una combinación que mezcla grasa, dulzor, acidez y picante.'},{country:'USA',name:'Philly cheesesteak',lat:39.95,lon:-75.16,sp:1,desc:'Carne de vacuno cortada fina y salteada a la plancha con cebolla, cubierta con queso fundido y servida en pan blando. Contundente, cremoso y muy ligado a la cultura urbana estadounidense.',story:'La historia tradicional sitúa su nacimiento en Filadelfia en 1930. Pat Olivieri, que vendía hot dogs, decidió un día cocinar carne de ternera en su plancha para hacerse un bocadillo; un taxista lo vio, pidió uno y aquello empezó a correr por la ciudad. Con el queso llegaría después el sandwich que terminó convirtiéndose en sinónimo de Philadelphia.'},{country:'Francia',name:'Jambon-beurre',lat:48.86,lon:2.35,sp:2,desc:'La expresión máxima de la sencillez francesa: baguette crujiente, mantequilla de muy buena calidad y jamón cocido. Un bocadillo limpio, elegante y dependiente por completo de la calidad del pan, la mantequilla y el embutido.',story:'Nació de la necesidad, no del lujo. En el París del siglo XIX, trabajadores de mercados como Les Halles comían pan con jamón y mantequilla porque era sencillo, nutritivo y fácil de llevar. Cuando la baguette se popularizó a principios del XX, el humilde almuerzo obrero terminó convertido en uno de los símbolos gastronómicos de París. Tres ingredientes. Más de un siglo de París.'},{country:'Vietnam',name:'Bánh mì',lat:21.03,lon:105.85,sp:3,desc:'El gran bocadillo vietnamita de influencia francoasiática: pan ligero y crujiente, paté, fiambres de cerdo, encurtidos, pepino, cilantro y chile. Fresco, ácido, aromático y muy equilibrado.',story:'Su historia empieza con la colonización francesa: Francia llevó a Vietnam la baguette, el pâté y la mayonesa. Los vietnamitas hicieron el resto: encurtidos, cilantro, chile, carnes locales y sus propios sabores transformaron aquella influencia colonial en algo completamente vietnamita. Francia puso el pan. Vietnam creó el icono.'},{country:'España',name:'Paquito de cordero',lat:40.42,lon:-3.70,sp:4,desc:'Una versión castiza y más cuidada del bocadillo madrileño: paletilla de cordero lechal muy jugosa, pimiento verde frito, cebolla glaseada y alioli de ajo asado, dentro de pan crujiente.',story:'Nació en Madrid en 2019, impulsado por INTEROVIC ante la caída continuada del consumo de carne de cordero en España, especialmente entre las nuevas generaciones. La idea era sacarlo de las recetas tradicionales y llevarlo a un formato más cotidiano y urbano: el bocadillo. Con la llegada del COVID y el fuerte golpe a la hostelería y al sector ovino, el Paquito ganó todavía más relevancia como una forma de reactivar su consumo. Si el bocadillo de ternera era el Pepito, el de cordero tendría nombre propio: Paquito.'},{country:'Japón',name:'Tamago sando',lat:35.68,lon:139.69,sp:5,desc:'El sándwich japonés de pan de leche suave relleno de ensalada de huevo cremosa con mayonesa japonesa. En esta versión, el huevo cocido con yema melosa en el centro aporta una presentación muy reconocible y golosa.',story:'El sándwich llegó a Japón durante la era Meiji, cuando el país comenzó a incorporar influencias occidentales; ya a finales del siglo XIX se vendían sandwiches como comida para llevar en estaciones de tren. Japón lo reinterpretó a su manera y de esa cultura nació el tamago sando: pan shokupan extremadamente suave, huevo y mayonesa, llevado a una textura casi cremosa. Con el auge de los konbini desde los años 70, acabó convirtiéndose en uno de esos alimentos cotidianos que puedes encontrar prácticamente a cualquier hora.'}];const S=[{country:'Side',name:'Yucas fritas',sp:6,desc:'Acompañadas de una crema de cilantro, lima y ají amarillo.'},{country:'Side',name:'César GUCHE',sp:7,desc:'Endivias y cogollos con aliño César de tahini, parmesano curado y semillas crujientes especiadas.'},{country:'Side',name:'Crispy chicken',sp:8,desc:'Rebozados y acompañados de un ranch de limón y hierbas.'}];function pos(el,n){el.style.backgroundPosition=positions[n].join(' ')}function card(x,side=false){const d=document.createElement('article');d.className='card';d.innerHTML=`<div class="pic"></div><div class="cardText"><div class="eyebrow">${side?'Side':x.country}</div><h3>${x.name}</h3>${side?`<p>${x.desc}</p>`:''}</div>`;pos(d.querySelector('.pic'),x.sp);d.addEventListener('click',()=>openModal(x,side));return d}P.forEach(x=>{products.append(card(x));const b=document.createElement('button');b.innerHTML=`<span>${x.country}</span><span>↗</span>`;b.addEventListener('click',()=>openModal(x));countries.append(b)});S.forEach(x=>sidegrid.append(card(x,true)));function openModal(x,side=false){modal.classList.add('open');pos(modalpic,x.sp);modalcountry.textContent=side?'Para acompañar':x.country;modalname.textContent=x.name;modaldesc.textContent=x.desc;modalstory.textContent=side?'Un acompañante pensado para completar cualquier guche sin competir con su origen.':x.story;document.body.style.overflow='hidden'}function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}closeBtn.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});const ctx=c.getContext('2d'),W=c.width,H=c.height,R=270,cx=W/2,cy=H/2;let rot=-10,drag=false,last=0;function proj(lat,lon){const la=lat*Math.PI/180,lo=(lon+rot)*Math.PI/180,x=Math.cos(la)*Math.sin(lo),y=Math.sin(la),z=Math.cos(la)*Math.cos(lo);return{x:cx+R*x,y:cy-R*y,z}}function line(points){ctx.beginPath();let started=false;points.forEach(([la,lo])=>{const p=proj(la,lo);if(p.z>0){if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}else started=false});ctx.stroke()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b0b0b';ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle='#101010';ctx.fill();ctx.strokeStyle='#343434';ctx.lineWidth=1;for(let la=-60;la<=60;la+=30)line(Array.from({length:181},(_,i)=>[la,-180+i*2]));for(let lo=-180;lo<180;lo+=30)line(Array.from({length:91},(_,i)=>[-90+i*2,lo]));P.forEach(x=>{const p=proj(x.lat,x.lon);if(p.z>0){ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fillStyle='#ff6b2c';ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.strokeStyle='#ff6b2c55';ctx.stroke();ctx.fillStyle='#fff';ctx.font='15px Arial';ctx.fillText(x.country,p.x+18,p.y+5)}});if(!drag)rot+=.07;requestAnimationFrame(draw)}c.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-last)*.35;last=e.clientX}});c.addEventListener('pointerup',()=>drag=false);draw()})();</script></body></html>
